[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicium-adapters"
version = "0.6.0"
# 3.11, not 3.12: nothing in the package needs 3.12 (no PEP 695 syntax, no
# 3.12-only stdlib API), the only runtime dependency indicium-standard already
# declares >=3.11, and the AgenticScienceBuilder environment that consumes the
# classification vocabulary these adapters feed runs 3.11 — a 3.12 floor made
# every DomainAdapter uninstallable there, which is where they are needed.
requires-python = ">=3.11"
description = "Community-extensible domain adapters for the indicium knowledge standard"
license = {file = "LICENSE"}
authors = [{name = "Louis-Felix Nothias", email = "louis-felix.nothias@cnrs.fr"}]
keywords = ["indicium", "knowledge-graph", "rdf", "shacl", "domain-adapter", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "indicium-standard>=2.0.0",
    "rdflib>=7.0",
]

[project.urls]
Homepage = "https://github.com/HolobiomicsLab/indicium-adapters"
Repository = "https://github.com/HolobiomicsLab/indicium-adapters"
Issues = "https://github.com/HolobiomicsLab/indicium-adapters/issues"
Changelog = "https://github.com/HolobiomicsLab/indicium-adapters/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyshacl>=0.26",
]
asb = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
verify-claims = "indicium_adapters.asb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/indicium_adapters"]

[tool.uv.sources]
indicium-standard = { path = "../indicium", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --cov=indicium_adapters --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# asb/cli.py is the `verify-claims` console-script entrypoint (argparse + main());
# a thin CLI wrapper exercised via integration, not unit tests — excluded from
# coverage so the 85% gate reflects the library code.
omit = ["*/indicium_adapters/asb/cli.py"]
