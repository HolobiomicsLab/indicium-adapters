[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicium-adapters"
version = "0.1.0"
requires-python = ">=3.12"
description = "Community-extensible domain adapters for the indicium knowledge standard"
dependencies = ["indicium>=1.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
metabolomics = []  # placeholder; add "chebi-lookup>=x" here if live lookups added later

[project.entry-points."indicium.adapters"]
metabolomics = "indicium_adapters.metabolomics:MetabolomicsAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/indicium_adapters"]

[tool.uv.sources]
indicium = { path = "../indicium", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
