name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # indicium-standard resolves from PyPI (2.0.0 and later).
          # .[asb] brings httpx + pydantic + pyyaml for the src/indicium_adapters/asb
          # submodule that tests/asb exercises; .[dev] brings pytest, pytest-cov,
          # pyshacl and the pinned ruff.
          pip install -e ".[dev,asb]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest --cov=indicium_adapters --cov-report=term-missing
